name: Deploy to GitHub Pages

# GitHub Pages cannot build a Next.js app on its own. Without this workflow it
# falls back to Jekyll and publishes README.md as the homepage.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Returns base_path ("/amara-vann-resort" today, "" once a custom domain
      # is attached) and base_url, so the build follows the Pages settings
      # instead of hard-coding the repo name.
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          BUILD_TARGET: static
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          # NEXT_PUBLIC_SITE_INDEXABLE stays unset on purpose: the content is
          # still placeholder, so every page ships noindex. See DEPLOY.md step 5.
        run: npm run build:static

      # Belt and braces - stops Pages ever treating _next/ as a Jekyll include.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
